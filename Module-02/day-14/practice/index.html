<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Exercises</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Question 1 -->
  <nav class="navbar">
    <div class="logo">MySite</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#" class="nav-btn">Contact</a></li>
    </ul>
  </nav>

  <!-- Question 2 -->
  <h2>2. Flexible Card Row</h2>
  <div class="card-row">
    <div class="card-item">Card 1</div>
    <div class="card-item">Card 2</div>
    <div class="card-item">Card 3</div>
    <div class="card-item">Card 4</div>
  </div>

  <!-- Question 3 -->
  <h2>3. Photo Gallery</h2>
  <div class="gallery">
    <div class="gallery-item"><img src="img1.jpg" alt="Photo 1"></div>
    <div class="gallery-item"><img src="img2.jpg" alt="Photo 2"></div>
    <div class="gallery-item"><img src="img3.jpg" alt="Photo 3"></div>
    <div class="gallery-item"><img src="img4.jpg" alt="Photo 4"></div>
    <div class="gallery-item"><img src="img5.jpg" alt="Photo 5"></div>
    <div class="gallery-item"><img src="img6.jpg" alt="Photo 6"></div>
  </div>

  <!-- Question 4 -->
  <h2>4. Full Page Layout (Demo)</h2>
  <div class="page-layout">
    <header class="page-header">Header</header>
    <aside class="page-sidebar">Sidebar</aside>
    <main class="page-main">Main Content</main>
    <footer class="page-footer">Footer</footer>
  </div>

  <!-- Question 5 -->
  <h2>5. Product Card</h2>
  <div class="product-card">
    <div class="product-badge">ETB Sale</div>
    <div class="product-image">🖼️</div>
    <h3>Product Name</h3>
    <p>Some description here.</p>
  </div>

</body>
</html>
