<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="menu">
    <h2>Our Menu</h2>
    <div class="menu-grid">
      <div class="card">
        <h3>Item One</h3>
        <p>A delicious dish description.</p>
        <span class="price">$9.99</span>
      </div>
      <div class="card">
        <h3>Item Two</h3>
        <p>Another tasty choice.</p>
        <span class="price">$12.99</span>
      </div>
      <div class="card">
        <h3>Item Three</h3>
        <p>Chef's speciality.</p>
        <span class="price">$14.99</span>
      </div>
      <div class="card">
        <h3>Item Four</h3>
        <p>Fresh ingredients daily.</p>
        <span class="price">$8.99</span>
      </div>
      <div class="card">
        <h3>Item Five</h3>
        <p>Classic favourite.</p>
        <span class="price">$10.99</span>
      </div>
      <div class="card">
        <h3>Item Six</h3>
        <p>Try it today.</p>
        <span class="price">$11.99</span>
      </div>
    </div>
  </section>
</body>
</html>
