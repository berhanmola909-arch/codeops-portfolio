<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Eatery</title>
</head>
<body>
  <header>
    <!-- hero Image -->
      <img src="heroImage.jpg" alt="Hbesha Eatery banner image" loading="lazy">

  </header>

  <main>
    <section id="form">
       <form action="" style=" height: 400px; width:300px ; border: solid;">
    <br>
    <label for="name">Name:</label>
    <input type="text" id="name">
    <br><br>
     <label for="email">Email:</label>
    <input type="email" id="email">
    <br><br>
    <label for="phonenum">Tel:</label>
    <input type="number" id="phonenumber"> 
    <br><br>
    <label for="date">Date:</label>
    <input type="date" id="date">
    <br><br>
    <label for="partysize">Party Size</label>
    <input type="number" id="partysize">
    <br><br>
    <label for="specialRequest">Special Request</label>
    <br><br>
    <textarea name="" id="specialRequest"></textarea>

    <br><br>

    <button type="submit">Submit</button>

   </form>


  </section>

  <section id="table">
        <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">price</th>  
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Beyayent</th>
            <th scope="row">100ETB</th>
          </tr>

          <tr>
            <th scope="row">Tibis</th>
            <th scope="row">1000ETB</th>
          </tr>

          <tr>
            <th scope="row">Shiro</th>
            <th scope="row">800ETB</th>
          </tr>
          
        </tbody>
      </table>
  </section>

  <section id="map">

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15761.895229064372!2d38.79212460407352!3d9.020469057243517!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b855cd643a691%3A0x5ce3922436b4f99a!2sMegenagna!5e0!3m2!1sen!2set!4v1785748760677!5m2!1sen!2set" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Megenagna location"></iframe>

  </section>

  </main> 

  <footer>Megenagna,Addis Abeba</footer>
</body>
</html>
